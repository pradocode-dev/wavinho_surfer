<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="icon" type="image/png" href="wavinho.png">
  
  <title>Wavinho Surfer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1a2c;
      position: fixed; /* Evita rolagem elástica no celular */
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none; /* Desativa gestos padrão do navegador como zoom e rolagem */
      user-select: none;
      -webkit-user-select: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // --- ESTADOS DO JOGO ---
  const STATE_LOGOS = 1;
  const STATE_MENU = 2;
  const STATE_PLAYING = 3;
  let gameState = STATE_LOGOS;

  let logoTimer = 0;
  let logoAlpha = 0;
  let logoStage = 1; 
  let suspensePlayed = false;

  let menuAlpha = 0;

  // --- SINTETIZADOR DE ÁUDIO & MÚSICA DE FUNDO ---
  let audioCtx = null;
  let bgmTimeout = null;
  let isMuted = false;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSuspenseSound() {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 2.5);
    
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1.0);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.5);
  }

  const bgmMelody = [
    329.63, 440.00, 493.88, 523.25, 
    659.25, 523.25, 493.88, 440.00, 
    329.63, 349.23, 440.00, 349.23, 
    329.63, 246.94, 220.00, 246.94  
  ];

  let bgmStep = 0;

  function startBGMusic() {
    if (bgmTimeout) clearTimeout(bgmTimeout);
    playNextNote();
  }

  function playNextNote() {
    if (!audioCtx || isMuted || (gameState !== STATE_PLAYING && gameState !== STATE_MENU) || gameOver) {
      bgmTimeout = null;
      return;
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    const freq = bgmMelody[bgmStep % bgmMelody.length];
    
    osc.type = 'triangle'; 
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);

    bgmStep++;

    const speedRatio = currentSpeed / baseSpeed;
    const nextDelay = Math.max(70, 300 / speedRatio);

    bgmTimeout = setTimeout(playNextNote, nextDelay);
  }

  function playJumpSound() {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.15);
    
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function playRiceSound() {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.05);
    
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playHiroUnlockSound() {
    if (!audioCtx || isMuted) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.06 + 0.15);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.06);
      osc.stop(audioCtx.currentTime + idx * 0.06 + 0.15);
    });
  }

  function playUraUnlockSound() {
    if (!audioCtx || isMuted) return;
    const notes = [659.25, 830.61, 987.77, 1318.51];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.06 + 0.15);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.06);
      osc.stop(audioCtx.currentTime + idx * 0.06 + 0.15);
    });
  }

  function playMakiUnlockSound() {
    if (!audioCtx || isMuted) return;
    const notes = [783.99, 987.77, 1174.66, 1567.98];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.06 + 0.15);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.06);
      osc.stop(audioCtx.currentTime + idx * 0.06 + 0.15);
    });
  }

  function playLoveWaveSound() {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
    
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }

  function playShurikenSound() {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);
    
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function playHitSound() {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
    
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  function playFireworkSound() {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
    
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }

  function playGameOverSound() {
    if (!audioCtx || isMuted) return;
    const notes = [300, 250, 200, 150];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + 0.15);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.12);
      osc.stop(audioCtx.currentTime + idx * 0.12 + 0.15);
    });
  }

  // --- WAVINHO ---
  const wavinho = {
    x: 0,
    y: 200,
    width: 95,  
    height: 70, 
    vy: 0,
    gravity: 0.6,
    jumpForce: -12,
    grounded: false,
    jumpsLeft: 2,
    angle: 0
  };

  // Resolução lógica fixa para manter a mesma proporção em celulares e PCs
  const LOGICAL_WIDTH = 1280;
  const LOGICAL_HEIGHT = 720;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // --- IMAGENS ---
  const imgMenuBg = new Image();
  imgMenuBg.src = 'menu_bg.png';

  const imgBtnSurfar = new Image();
  imgBtnSurfar.src = 'botao_surfar.png';

  const imgCozinha = new Image();
  imgCozinha.src = 'cozinha.png';

  const imgWavinho = new Image();
  imgWavinho.src = 'wavinho.png';

  const imgBoia = new Image();
  imgBoia.src = 'boia.png';

  const imgGaivota = new Image();
  imgGaivota.src = 'gaivota.png';

  const imgWaveSushi = new Image();
  imgWaveSushi.src = 'wavesushi.png';

  const imgPradoComics = new Image();
  imgPradoComics.src = 'pradocomics.png';

  const imgHlGames = new Image();
  imgHlGames.src = 'hlgames.png';

  const imgHiro = new Image();
  imgHiro.src = 'hiro.png';

  const imgUra = new Image();
  imgUra.src = 'ura.png';

  const imgMaki = new Image();
  imgMaki.src = 'maki.png';

  // --- CONTROLE DE ROLAGEM ---
  let bgX = 0;
  const bgSpeedRatio = 0.25;

  const splashParticles = [];
  const fireworks = [];
  const shurikens = [];
  const smokeParticles = [];
  const heartWaves = [];

  let shurikenTimer = 0;
  let successfulJumpsCount = 0; 

  function createSplash(x, y, count = 12, isJump = false) {
    for (let i = 0; i < count; i++) {
      const angle = isJump 
        ? Math.PI * 0.2 + Math.random() * Math.PI * 0.6
        : Math.PI * 1.1 + Math.random() * Math.PI * 0.8;

      const speed = 2 + Math.random() * (isJump ? 5 : 7);
      
      splashParticles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed - (isJump ? 0 : currentSpeed * 0.3),
        vy: Math.sin(angle) * speed,
        radius: 2 + Math.random() * 3.5,
        alpha: 1,
        decay: 0.02 + Math.random() * 0.03,
        color: '#4fc3f7'
      });
    }
  }

  function createSmokeBomb(x, y) {
    for (let i = 0; i < 35; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 6;
      smokeParticles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 0.5,
        radius: 12 + Math.random() * 20,
        alpha: 0.85,
        decay: 0.015 + Math.random() * 0.02,
        color: Math.random() < 0.5 ? '#ffffff' : '#b0bec5'
      });
    }
  }

  function launchFirework() {
    const x = LOGICAL_WIDTH * 0.2 + Math.random() * (LOGICAL_WIDTH * 0.6);
    const y = LOGICAL_HEIGHT * 0.15 + Math.random() * (LOGICAL_HEIGHT * 0.35);
    const colors = ['#FFD700', '#FF4500', '#00FFFF', '#FF69B4', '#ADFF2F', '#FFFFFF'];
    const color = colors[Math.floor(Math.random() * colors.length)];

    playFireworkSound();

    for (let i = 0; i < 45; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      fireworks.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 3 + Math.random() * 3,
        color: color,
        alpha: 1,
        decay: 0.012 + Math.random() * 0.015
      });
    }
  }

  const scorePopups = [];

  function addScorePopup(x, y, text, color = '#FFD700') {
    scorePopups.push({
      x: x,
      y: y,
      text: text,
      color: color,
      alpha: 1,
      vy: -1.5
    });
  }

  let milestoneMessage = "";
  let milestoneTimer = 0;
  let lastMilestone = 0;

  function checkMilestone() {
    const currentMilestone = Math.floor(score / 5000) * 5000;
    
    if (currentMilestone > 0 && currentMilestone > lastMilestone) {
      lastMilestone = currentMilestone;
      milestoneTimer = 220; 

      if (currentMilestone === 5000) {
        milestoneMessage = "FANTÁSTICO!";
      } else if (currentMilestone === 10000) {
        milestoneMessage = "EXTRAORDINÁRIO!";
      } else if (currentMilestone === 15000) {
        milestoneMessage = "MARAVILHOSO!";
      } else if (currentMilestone === 20000) {
        milestoneMessage = "SENSACIONAL!";
      } else if (currentMilestone === 25000) {
        milestoneMessage = "ESPETACULAR!";
      } else if (currentMilestone === 30000) {
        milestoneMessage = "MAGNÍFICO!";
      } else if (currentMilestone === 35000) {
        milestoneMessage = "IMPRESSIONANTE!";
      } else if (currentMilestone === 40000) {
        milestoneMessage = "FABULOSO!";
      } else if (currentMilestone === 45000) {
        milestoneMessage = "ESTUPENDO!";          
      } else {
        milestoneMessage = "ADMIRÁVEL";
      }

      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          if (!gameOver) launchFirework();
        }, i * 250);
      }
    }
  }

  let hiroActive = false;
  let uraActive = false;
  let makiActive = false;
  let sushiCounter = 0; 
  let invincibleTimer = 0; 
  let hiroHitCounter = 0; 
  let heartShieldCount = 0; 

  let waveOffset = 0;
  let waveSpeed = 0.08;

  let distance = 0;           
  let score = 0;            
  let highScore = 0;         
  let gameOver = false;

  const baseSpeed = 6;
  let currentSpeed = baseSpeed;

  const obstacles = [];
  let obstacleTimer = 0;

  const waveSushis = [];
  let sushiSpawnTimer = 0;

  function getWaveHeightAt(x) {
    const waveBaseY = LOGICAL_HEIGHT - 180;
    return waveBaseY + Math.sin(x * 0.008 + waveOffset) * 18 + Math.cos(x * 0.015 + waveOffset * 0.5) * 8;
  }

  function startGamePlay() {
    distance = 0;
    score = 0;
    hiroActive = false;
    uraActive = false;
    makiActive = false;
    sushiCounter = 0;
    invincibleTimer = 0;
    hiroHitCounter = 0;
    heartShieldCount = 0;
    currentSpeed = baseSpeed;
    waveSpeed = 0.08;
    bgX = 0;
    lastMilestone = 0;
    milestoneMessage = "";
    milestoneTimer = 0;
    shurikenTimer = 0;
    successfulJumpsCount = 0;
    obstacles.length = 0;
    waveSushis.length = 0;
    splashParticles.length = 0;
    fireworks.length = 0;
    shurikens.length = 0;
    smokeParticles.length = 0;
    heartWaves.length = 0;
    scorePopups.length = 0;
    obstacleTimer = 0;
    sushiSpawnTimer = 0;
    wavinho.x = 250;
    wavinho.y = 200;
    wavinho.vy = 0;
    wavinho.grounded = false;
    wavinho.jumpsLeft = 2;
    gameOver = false;
    gameState = STATE_PLAYING;
    
    if (audioCtx && !isMuted) {
      startBGMusic();
    }
  }

  function checkMuteClick(logicX, logicY) {
    if (logicX >= LOGICAL_WIDTH - 60 && logicX <= LOGICAL_WIDTH - 20 && logicY >= 20 && logicY <= 60) {
      isMuted = !isMuted;
      if (!isMuted && gameState === STATE_PLAYING && !gameOver && audioCtx) {
        startBGMusic();
      }
      return true;
    }
    return false;
  }

  function handleAction(e) {
    initAudio();

    let clientX = 0, clientY = 0;
    if (e.type === 'touchstart' && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
      e.preventDefault(); // Previne comportamento duplo de toque/clique em mobile
    } else if (e.type === 'click') {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    // Converte coordenadas da tela para o espaço lógico (mantendo proporção perfeita em qualquer celular)
    const scaleX = canvas.width / LOGICAL_WIDTH;
    const scaleY = canvas.height / LOGICAL_HEIGHT;
    const scale = Math.min(scaleX, scaleY);

    const offsetX = (canvas.width - LOGICAL_WIDTH * scale) / 2;
    const offsetY = (canvas.height - LOGICAL_HEIGHT * scale) / 2;

    const logicX = (clientX - offsetX) / scale;
    const logicY = (clientY - offsetY) / scale;

    if (checkMuteClick(logicX, logicY)) return;

    if (gameState === STATE_LOGOS) {
      logoStage = 3;
      logoAlpha = 0.01;
    } else if (gameState === STATE_MENU) {
      const btnW = 280;
      const btnH = 80;
      const btnX = LOGICAL_WIDTH / 2 - btnW / 2;
      const btnY = LOGICAL_HEIGHT / 2 + 60;
      if (logicX >= btnX && logicX <= btnX + btnW && logicY >= btnY && logicY <= btnY + btnH) {
        startGamePlay();
      }
    } else if (gameState === STATE_PLAYING) {
      if (gameOver) {
        startGamePlay();
      } else if (wavinho.jumpsLeft > 0) {
        wavinho.vy = wavinho.jumpForce;
        wavinho.grounded = false;
        wavinho.jumpsLeft--;
        playJumpSound();
        createSplash(wavinho.x + wavinho.width * 0.5, wavinho.y + wavinho.height, 12, true);
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      initAudio();
      if (gameState === STATE_LOGOS) {
        logoStage = 3;
        logoAlpha = 0.01;
      } else if (gameState === STATE_MENU) {
        startGamePlay();
      } else if (gameState === STATE_PLAYING) {
        if (gameOver) {
          startGamePlay();
        } else if (wavinho.jumpsLeft > 0) {
          wavinho.vy = wavinho.jumpForce;
          wavinho.grounded = false;
          wavinho.jumpsLeft--;
          playJumpSound();
          createSplash(wavinho.x + wavinho.width * 0.5, wavinho.y + wavinho.height, 12, true);
        }
      }
    }
  });
  window.addEventListener('touchstart', handleAction, { passive: false });
  canvas.addEventListener('click', handleAction);

  function checkCollisionCorrected(r1, r2) {
    const marginX = 10;
    const marginY = 10;
    return (
      r1.x + marginX < r2.x + r2.width - marginX &&
      r1.x + r1.width - marginX > r2.x + marginX &&
      r1.y + marginY < r2.y + r2.height - marginY &&
      r1.y + r1.height - marginY > r2.y + marginY
    );
  }

  function drawHiro(x, y, width, height, angle = 0) {
    ctx.save();
    ctx.translate(x + width / 2, y + height / 2);
    ctx.rotate(angle);

    if (imgHiro.complete && imgHiro.naturalWidth !== 0) {
      ctx.drawImage(imgHiro, -width / 2, -height / 2, width, height);
    } else {
      ctx.fillStyle = '#D32F2F';
      ctx.beginPath();
      ctx.arc(0, 0, width / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawUra(x, y, width, height, angle = 0) {
    ctx.save();
    ctx.translate(x + width / 2, y + height / 2);
    ctx.rotate(angle);

    if (imgUra.complete && imgUra.naturalWidth !== 0) {
      ctx.drawImage(imgUra, -width / 2, -height / 2, width, height);
    } else {
      ctx.fillStyle = '#FF69B4';
      ctx.beginPath();
      ctx.arc(0, 0, width / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawMaki(x, y, width, height, angle = 0) {
    ctx.save();
    const centerX = x + width / 2;
    const centerY = y + height / 2;

    ctx.translate(centerX, centerY);
    ctx.rotate(angle);

    if (imgMaki.complete && imgMaki.naturalWidth !== 0) {
      ctx.drawImage(imgMaki, -width / 2, -height / 2, width, height);
    } else {
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.arc(0, 0, width / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawShuriken(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);

    if (s.isNoriBuffed) {
      ctx.shadowColor = '#2E8B57';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#98FB98';
      ctx.strokeStyle = '#006400';
    } else {
      ctx.fillStyle = '#E0E0E0';
      ctx.strokeStyle = '#333333';
    }
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      ctx.lineTo(0, -12);
      ctx.lineTo(3, -3);
      ctx.rotate(Math.PI / 2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = s.isNoriBuffed ? '#006400' : '#111';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // --- LOOP PRINCIPAL DO JOGO ---
  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // Sistema de escala responsiva Letterbox para celulares e computadores
    const scaleX = canvas.width / LOGICAL_WIDTH;
    const scaleY = canvas.height / LOGICAL_HEIGHT;
    const scale = Math.min(scaleX, scaleY);

    const offsetX = (canvas.width - LOGICAL_WIDTH * scale) / 2;
    const offsetY = (canvas.height - LOGICAL_HEIGHT * scale) / 2;

    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    if (gameState === STATE_LOGOS) {
      if (!suspensePlayed) {
        suspensePlayed = true;
        playSuspenseSound();
      }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

      if (logoStage === 1) {
        logoAlpha += 0.02;
        if (logoAlpha >= 1) {
          logoAlpha = 1;
          logoStage = 2;
          logoTimer = 120;
        }
      } else if (logoStage === 2) {
        logoTimer--;
        if (logoTimer <= 0) {
          logoStage = 3;
        }
      } else if (logoStage === 3) {
        logoAlpha -= 0.02;
        if (logoAlpha <= 0) {
          logoAlpha = 0;
          gameState = STATE_MENU;
          if (audioCtx && !isMuted) {
            startBGMusic();
          }
        }
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, logoAlpha);

      const logoW = 160;
      const logoH = 160;
      const gap = 40;
      const totalWidth = (logoW * 3) + (gap * 2);
      let startX = (LOGICAL_WIDTH - totalWidth) / 2;
      let startY = LOGICAL_HEIGHT / 2 - (logoH / 2) - 40;

      if (imgWaveSushi.complete && imgWaveSushi.naturalWidth !== 0) {
        ctx.drawImage(imgWaveSushi, startX, startY, logoW, logoH);
      }
      startX += logoW + gap;

      if (imgPradoComics.complete && imgPradoComics.naturalWidth !== 0) {
        ctx.drawImage(imgPradoComics, startX, startY, logoW, logoH);
      }
      startX += logoW + gap;

      if (imgHlGames.complete && imgHlGames.naturalWidth !== 0) {
        ctx.drawImage(imgHlGames, startX, startY, logoW, logoH);
      }

      ctx.fillStyle = '#333333';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.1)';
      ctx.shadowBlur = 4;
      ctx.fillText('APRESENTA:', LOGICAL_WIDTH / 2, startY + logoH + 60);

      ctx.restore();

    } else if (gameState === STATE_MENU) {
      if (imgMenuBg.complete && imgMenuBg.naturalWidth !== 0) {
        ctx.drawImage(imgMenuBg, 0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      } else {
        ctx.fillStyle = '#0a0502';
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      }

      if (menuAlpha < 1) {
        menuAlpha += 0.03;
        if (menuAlpha > 1) menuAlpha = 1;
      }

      ctx.save();
      ctx.globalAlpha = menuAlpha;

      const centerX = LOGICAL_WIDTH / 2;
      const centerY = LOGICAL_HEIGHT / 2;

      const btnW = 280;
      const btnH = 280;
      const btnX = centerX - btnW / 2;
      const btnY = centerY + 60;

      const isVisible = Math.floor(Date.now() / 300) % 2 === 0;

      if (isVisible) {
        if (imgBtnSurfar.complete && imgBtnSurfar.naturalWidth !== 0) {
          ctx.drawImage(imgBtnSurfar, btnX, btnY, btnW, btnH);
        } else {
          ctx.fillStyle = '#FF7F50';
          ctx.fillRect(btnX, btnY, btnW, btnH);
        }
      }

      ctx.restore();

    } else if (gameState === STATE_PLAYING) {
      if (!gameOver) {
        distance += currentSpeed * 0.05; 
        
        if (score > highScore) highScore = score;

        checkMilestone();

        currentSpeed = baseSpeed + (score / 2200);
        waveSpeed = 0.08 + (currentSpeed - baseSpeed) * 0.008;

        bgX -= currentSpeed * bgSpeedRatio;
        if (bgX <= -LOGICAL_WIDTH) bgX = 0;

        if (imgCozinha.complete && imgCozinha.naturalWidth !== 0) {
          ctx.drawImage(imgCozinha, bgX, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
          ctx.drawImage(imgCozinha, bgX + LOGICAL_WIDTH, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
        } else {
          ctx.fillStyle = '#120a06';
          ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
        }

        waveOffset += waveSpeed;
        if (invincibleTimer > 0) invincibleTimer--;

        const wasGrounded = wavinho.grounded;
        wavinho.vy += wavinho.gravity;
        wavinho.y += wavinho.vy;

        const wavinhoBottomX = wavinho.x + wavinho.width / 2;
        const currentWaveY = getWaveHeightAt(wavinhoBottomX);

        if (wavinho.y + wavinho.height >= currentWaveY) {
          wavinho.y = currentWaveY - wavinho.height;
          wavinho.vy = 0;
          wavinho.grounded = true;
          wavinho.jumpsLeft = 2;

          if (!wasGrounded) {
            createSplash(wavinhoBottomX, currentWaveY, 16, false);
          }

          const nextWaveY = getWaveHeightAt(wavinhoBottomX + 10);
          wavinho.angle = Math.atan2(nextWaveY - currentWaveY, 10);
        } else {
          wavinho.angle = Math.max(-0.4, Math.min(0.4, wavinho.vy * 0.04));
        }

        sushiSpawnTimer++;
        if (sushiSpawnTimer > 70 + Math.random() * 50) {
          const startX = LOGICAL_WIDTH + 50;
          const baseArcY = getWaveHeightAt(startX) - 70 - Math.random() * 50;
          
          waveSushis.push({
            x: startX,
            y: baseArcY,
            width: 68,
            height: 68
          });
          
          sushiSpawnTimer = 0;
        }

        for (let i = waveSushis.length - 1; i >= 0; i--) {
          const s = waveSushis[i];
          s.x -= currentSpeed;

          if (checkCollisionCorrected(wavinho, s)) {
            score += 100; 
            sushiCounter++;

            if (!hiroActive && sushiCounter >= 7) {
              hiroActive = true;
              sushiCounter = 0; 
              score += 500; 
              addScorePopup(s.x, s.y, '+500 HIRO DESBLOQUEADO!', '#FFD700');
              playHiroUnlockSound();
              
              const initialHiroX = wavinho.x - 220;
              const initialHiroAirY = getWaveHeightAt(initialHiroX + wavinho.width / 2) - 130;
              createSmokeBomb(initialHiroX + wavinho.width / 2, initialHiroAirY + wavinho.height / 2);

              for (let f = 0; f < 3; f++) {
                setTimeout(() => { if (!gameOver) launchFirework(); }, f * 200);
              }
            } else if (hiroActive && !uraActive && sushiCounter >= 7) {
              uraActive = true;
              sushiCounter = 0; 
              score += 500;
              addScorePopup(s.x, s.y, '+500 URA DESBLOQUEADA!', '#FF69B4');
              playUraUnlockSound();

              const initialUraX = wavinho.x - 120;
              const initialUraBottomX = initialUraX + wavinho.width / 2;
              const initialUraWaveY = getWaveHeightAt(initialUraBottomX);
              createSmokeBomb(initialUraBottomX, initialUraWaveY - wavinho.height / 2);

              for (let f = 0; f < 3; f++) {
                setTimeout(() => { if (!gameOver) launchFirework(); }, f * 200);
              }
            } else if (uraActive && !makiActive && sushiCounter >= 7) {
              makiActive = true;
              sushiCounter = 0;
              score += 500;
              addScorePopup(s.x, s.y, '+500 MAKI DESBLOQUEADA!', '#2E8B57');
              playMakiUnlockSound();

              const initialMakiX = wavinho.x - 320;
              const initialMakiAirY = getWaveHeightAt(initialMakiX + wavinho.width / 2) - 130;
              createSmokeBomb(initialMakiX + wavinho.width / 2, initialMakiAirY + wavinho.height / 2);

              for (let f = 0; f < 3; f++) {
                setTimeout(() => { if (!gameOver) launchFirework(); }, f * 200);
              }
            } else {
              addScorePopup(s.x, s.y, '+100', '#FFFFFF');
              playRiceSound();
            }

            waveSushis.splice(i, 1);
            continue;
          }
          if (s.x + s.width < -50) waveSushis.splice(i, 1);
        }

        const allFourFriends = (hiroActive && uraActive && makiActive);

        obstacleTimer++;
        const baseObstacleInterval = allFourFriends ? 50 : 100;
        const obstacleInterval = Math.max(20, baseObstacleInterval + Math.random() * 40);

        if (obstacleTimer > obstacleInterval) {
          let type = 'boia';
          if (uraActive && score >= 10000) {
            type = Math.random() < 0.5 ? 'boia' : 'gaivota';
          }

          if (type === 'boia') {
            obstacles.push({
              type: 'boia',
              x: LOGICAL_WIDTH + 50,
              y: getWaveHeightAt(LOGICAL_WIDTH + 50) - 50 + 5,
              width: 160,
              height: 70,
              angle: 0,
              passed: false
            });
          } else {
            obstacles.push({
              type: 'gaivota',
              x: LOGICAL_WIDTH + 50,
              y: getWaveHeightAt(LOGICAL_WIDTH + 50) - 120 - Math.random() * 40,
              width: 170,
              height: 60,
              angle: 0,
              passed: false
            });
          }
          obstacleTimer = 0;
        }

        let hiroPos = null;
        let uraPos = null;
        let makiPos = null;

        if (hiroActive) {
          const hiroX = wavinho.x - 220;
          const hiroBottomX = hiroX + wavinho.width / 2;
          const hiroWaveY = getWaveHeightAt(hiroBottomX);
          const hiroY = hiroWaveY - 130 + Math.sin(waveOffset * 1.5) * 8; 

          hiroPos = {
            x: hiroX,
            y: hiroY,
            angle: Math.sin(waveOffset * 1.5) * 0.1
          };

          shurikenTimer++;
          if (shurikenTimer > 70) { 
            const validTargets = obstacles.filter(o => o.x > hiroPos.x);
            if (validTargets.length > 0) {
              const targetObs = validTargets[Math.floor(Math.random() * validTargets.length)];
              const startX = hiroPos.x + 20;
              const startY = hiroPos.y + 20;

              const targetCenterX = targetObs.x + targetObs.width / 2;
              const targetCenterY = targetObs.y + targetObs.height / 2;
              const dx = targetCenterX - startX;
              const dy = targetCenterY - startY;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const speedShuriken = 14;

              shurikens.push({
                x: startX,
                y: startY,
                vx: (dx / dist) * speedShuriken,
                vy: (dy / dist) * speedShuriken,
                angle: 0,
                isNoriBuffed: false
              });

              playShurikenSound();
              shurikenTimer = 0;
            }
          }
        }

        if (uraActive) {
          const uraX = wavinho.x - 120;
          const uraBottomX = uraX + wavinho.width / 2;
          const uraWaveY = getWaveHeightAt(uraBottomX);
          uraPos = {
            x: uraX,
            y: uraWaveY - wavinho.height,
            angle: Math.sin(waveOffset * 0.8) * 0.05
          };
        }

        if (makiActive) {
          const makiX = wavinho.x - 320; 
          const makiBottomX = makiX + wavinho.width / 2;
          const makiWaveY = getWaveHeightAt(makiBottomX);
          const makiY = makiWaveY - 55 + Math.cos(waveOffset * 1.5) * 8;

          makiPos = {
            x: makiX,
            y: makiY,
            angle: Math.cos(waveOffset * 1.5) * 0.1
          };
        }

        for (let i = shurikens.length - 1; i >= 0; i--) {
          const sh = shurikens[i];
          
          sh.x += sh.vx;
          sh.y += sh.vy;
          sh.angle += 0.4;

          let shurikenHit = false;
          for (let j = obstacles.length - 1; j >= 0; j--) {
            const obs = obstacles[j];
            if (sh.x >= obs.x && sh.x <= obs.x + obs.width &&
                sh.y >= obs.y && sh.y <= obs.y + obs.height) {
              
              const pts = obs.type === 'gaivota' ? 200 : 150;
              score += pts;
              addScorePopup(obs.x, obs.y, `+${pts} NINJA CUT!`, sh.isNoriBuffed ? '#98FB98' : '#FFD700');
              createSplash(obs.x + obs.width/2, obs.y + obs.height/2, 15, false);
              
              obstacles.splice(j, 1);
              shurikenHit = true;

              if (uraActive) {
                hiroHitCounter++;
                if (hiroHitCounter >= 5) {
                  hiroHitCounter = 0;
                  heartShieldCount = Math.min(5, heartShieldCount + 1); 
                  playLoveWaveSound();
                  addScorePopup(wavinho.x, wavinho.y - 40, '❤ ONDA DE AMOR! ESCUDO +1', '#FF69B4');
                  
                  heartWaves.push({
                    x: uraPos.x + wavinho.width * 0.55,
                    y: uraPos.y + wavinho.height * 0.55,
                    radius: 20,
                    maxRadius: 300,
                    alpha: 1
                  });
                }
              }

              break;
            }
          }

          if (shurikenHit || sh.x > LOGICAL_WIDTH + 100 || sh.x < -100 || sh.y > LOGICAL_HEIGHT + 100 || sh.y < -100) {
            shurikens.splice(i, 1);
          }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= currentSpeed;
          
          if (obs.type === 'boia') {
            obs.y = getWaveHeightAt(obs.x + obs.width / 2) - obs.height + 5;
          } else if (obs.type === 'gaivota') {
            if (makiActive) {
              obs.angle += 0.1;
            } else {
              obs.angle = 0;
            }
          }

          if (!obs.passed && obs.x + obs.width < wavinho.x) {
            obs.passed = true;
            successfulJumpsCount++;

            const pontosSalto = allFourFriends ? 1000 : 100;
            score += pontosSalto;
            addScorePopup(wavinho.x, wavinho.y - 30, `+${pontosSalto} SALTO!`, allFourFriends ? '#FFD700' : '#FFFFFF');

            if (successfulJumpsCount % 3 === 0) {
              if (makiActive && makiPos && hiroActive && hiroPos) {
                heartWaves.push({
                  x: makiPos.x + 45,
                  y: makiPos.y + 50,
                  radius: 10,
                  maxRadius: 280,
                  alpha: 1.0,
                  isNoriWave: true
                });
                playLoveWaveSound();

                for (let k = -1; k <= 1; k++) {
                  shurikens.push({
                    x: hiroPos.x + 40,
                    y: hiroPos.y + 20,
                    vx: 16,
                    vy: k * 3.5,
                    angle: 0,
                    isNoriBuffed: true
                  });
                }
                playShurikenSound();
                addScorePopup(hiroPos.x, hiroPos.y - 20, 'ATAQUE SUPORTE NORI!', '#2E8B57');
              }
            }
          }

          if (invincibleTimer === 0 && checkCollisionCorrected(wavinho, obs)) {
            if (heartShieldCount > 0) {
              heartShieldCount--;
              invincibleTimer = 45;
              playHitSound();
              addScorePopup(obs.x, obs.y, `❤ ESCUDO PROTEGEU! (${heartShieldCount}/5)`, '#FF69B4');
              createSmokeBomb(obs.x + obs.width / 2, obs.y + obs.height / 2);
              obstacles.splice(i, 1);
            } else if (makiActive) {
              makiActive = false;
              sushiCounter = 0;
              invincibleTimer = 60;

              addScorePopup(obs.x, obs.y, 'MAKI SAIU!', '#2E8B57');
              playHitSound();
              const makiX = wavinho.x - 320;
              const makiAirY = getWaveHeightAt(makiX + wavinho.width / 2) - 130;
              createSmokeBomb(makiX + wavinho.width / 2, makiAirY + wavinho.height / 2);
              obstacles.splice(i, 1);
            } else if (uraActive) {
              uraActive = false;
              sushiCounter = 0;
              invincibleTimer = 60;

              addScorePopup(obs.x, obs.y, 'URA SAIU!', '#FF69B4');
              playHitSound();
              const uraBottomX = (wavinho.x - 120) + wavinho.width / 2;
              createSmokeBomb(uraBottomX, getWaveHeightAt(uraBottomX) - wavinho.height / 2);
              obstacles.splice(i, 1);
            } else if (hiroActive) {
              hiroActive = false;
              sushiCounter = 0; 
              invincibleTimer = 60;

              addScorePopup(obs.x, obs.y, 'HIRO SAIU!', '#FF4500');
              playHitSound();
              const hiroX = wavinho.x - 220;
              const hiroAirY = getWaveHeightAt(hiroX + wavinho.width / 2) - 130;
              createSmokeBomb(hiroX + wavinho.width / 2, hiroAirY + wavinho.height / 2);
              obstacles.splice(i, 1);
            } else {
              playGameOverSound();
              createSplash(wavinho.x + wavinho.width / 2, wavinho.y + wavinho.height / 2, 35, false);
              gameOver = true;
            }
          }
          if (obs.x + obs.width < -50) obstacles.splice(i, 1);
        }

        ctx.fillStyle = '#0a0502'; 
        ctx.beginPath();
        ctx.moveTo(0, LOGICAL_HEIGHT);
        for (let x = 0; x <= LOGICAL_WIDTH + 10; x += 10) {
          ctx.lineTo(x, getWaveHeightAt(x));
        }
        ctx.lineTo(LOGICAL_WIDTH, LOGICAL_HEIGHT);
        ctx.fill();

        ctx.strokeStyle = '#4fc3f7';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= LOGICAL_WIDTH + 10; x += 10) {
          ctx.lineTo(x, getWaveHeightAt(x));
        }
        ctx.stroke();

        for (let i = splashParticles.length - 1; i >= 0; i--) {
          const p = splashParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.3;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            splashParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (let i = smokeParticles.length - 1; i >= 0; i--) {
          const sm = smokeParticles[i];
          sm.x += sm.vx;
          sm.y += sm.vy;
          sm.radius += 0.4;
          sm.alpha -= sm.decay;

          if (sm.alpha <= 0) {
            smokeParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, sm.alpha);
          ctx.fillStyle = sm.color;
          ctx.beginPath();
          ctx.arc(sm.x, sm.y, sm.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (let i = heartWaves.length - 1; i >= 0; i--) {
          const hw = heartWaves[i];
          hw.radius += 4;
          hw.alpha -= 0.025;

          if (hw.alpha <= 0) {
            heartWaves.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, hw.alpha);
          ctx.strokeStyle = hw.isNoriWave ? '#2E8B57' : '#FF69B4';
          ctx.lineWidth = hw.isNoriWave ? 5 : 4;
          ctx.beginPath();
          ctx.arc(hw.x, hw.y, hw.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (const sh of shurikens) {
          drawShuriken(sh);
        }

        for (const s of waveSushis) {
          ctx.save();
          const centerX = s.x + s.width / 2;
          const centerY = s.y + s.height / 2;

          ctx.shadowColor = '#FFD700';
          ctx.shadowBlur = 18;
          ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
          ctx.beginPath();
          ctx.arc(centerX, centerY, (s.width / 2) + 2, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();

          if (imgWaveSushi.complete && imgWaveSushi.naturalWidth !== 0) {
            ctx.drawImage(imgWaveSushi, s.x, s.y, s.width, s.height);
          } else {
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(centerX, centerY, s.width / 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (const obs of obstacles) {
          if (obs.type === 'boia') {
            if (imgBoia.complete && imgBoia.naturalWidth !== 0) {
              ctx.drawImage(imgBoia, obs.x, obs.y, obs.width, obs.height);
            } else {
              ctx.fillStyle = '#e74c3c';
              ctx.beginPath();
              ctx.arc(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (obs.type === 'gaivota') {
            ctx.save();
            ctx.translate(obs.x + obs.width / 2, obs.y + obs.height / 2);
            ctx.rotate(obs.angle); 
            
            if (imgGaivota.complete && imgGaivota.naturalWidth !== 0) {
              ctx.drawImage(imgGaivota, -obs.width / 2, -obs.height / 2, obs.width, obs.height);
            } else {
              ctx.fillStyle = '#f39c12';
              ctx.fillRect(-obs.width / 2, -obs.height / 2, obs.width, obs.height);
            }
            ctx.restore();
          }
        }

        for (let i = scorePopups.length - 1; i >= 0; i--) {
          const pop = scorePopups[i];
          pop.y += pop.vy;
          pop.alpha -= 0.02;

          if (pop.alpha <= 0) {
            scorePopups.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, pop.alpha);
          ctx.fillStyle = pop.color;
          ctx.font = 'bold 20px sans-serif';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 4;
          ctx.fillText(pop.text, pop.x, pop.y);
          ctx.restore();
        }

        if (hiroActive && hiroPos) {
          drawHiro(hiroPos.x, hiroPos.y, wavinho.width * 1.1, wavinho.height * 1.1, hiroPos.angle);
        }

        if (uraActive && uraPos) {
          drawUra(uraPos.x, uraPos.y, wavinho.width * 1.1, wavinho.height * 1.1, uraPos.angle);
        }

        if (makiActive && makiPos) {
          drawMaki(makiPos.x, makiPos.y, 90, 100, makiPos.angle);
        }

        if (invincibleTimer % 8 < 4) {
          ctx.save();
          ctx.translate(wavinho.x + wavinho.width / 2, wavinho.y + wavinho.height / 2);
          ctx.rotate(wavinho.angle);
          ctx.drawImage(imgWavinho, -wavinho.width / 2, -wavinho.height / 2, wavinho.width, wavinho.height);
          ctx.restore();
        }

        if (heartShieldCount > 0) {
          ctx.save();
          ctx.translate(wavinho.x + wavinho.width / 2, wavinho.y + wavinho.height / 2);
          
          ctx.fillStyle = 'rgba(255, 105, 180, 0.15)';
          ctx.strokeStyle = 'rgba(255, 105, 180, 0.45)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(wavinho.width, wavinho.height) * 0.85, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = 'rgba(255, 105, 180, 0.35)';
          ctx.strokeStyle = '#FF69B4';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#FF69B4';
          ctx.shadowBlur = 8;

          const hSize = 32; 
          ctx.beginPath();
          ctx.moveTo(0, hSize * 0.3);
          ctx.bezierCurveTo(-hSize, -hSize * 0.6, -hSize * 1.2, hSize * 0.5, 0, hSize * 1.2);
          ctx.bezierCurveTo(hSize * 1.2, hSize * 0.5, hSize, -hSize * 0.6, 0, hSize * 0.3);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${heartShieldCount}/5`, 0, 4);

          ctx.restore();
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
          const f = fireworks[i];
          f.x += f.vx;
          f.y += f.vy;
          f.vy += 0.08; 
          f.alpha -= f.decay;

          if (f.alpha <= 0) {
            fireworks.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, f.alpha);
          ctx.fillStyle = f.color;
          ctx.shadowColor = f.color;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (milestoneTimer > 0) {
          milestoneTimer--;
          ctx.save();
          ctx.textAlign = 'center';
          
          const scaleText = 1 + Math.sin(milestoneTimer * 0.1) * 0.08;
          ctx.font = `bold ${Math.floor(36 * scaleText)}px sans-serif`;
          
          ctx.fillStyle = '#FFD700';
          ctx.shadowColor = 'rgba(255, 69, 0, 0.9)';
          ctx.shadowBlur = 16;
          ctx.fillText(milestoneMessage, LOGICAL_WIDTH / 2, LOGICAL_HEIGHT * 0.35);
          ctx.restore();
        }

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 6;
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`PONTOS: ${Math.floor(score)}`, LOGICAL_WIDTH / 2, LOGICAL_HEIGHT - 45);
        ctx.restore();
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(LOGICAL_WIDTH - 60, 20, 40, 40);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '20px sans-serif';
      ctx.fillText(isMuted ? '🔇' : '🔊', LOGICAL_WIDTH - 52, 48);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.font = 'bold 42px sans-serif';
        ctx.fillText('GAME OVER', LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2 - 50);

        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 26px sans-serif';
        ctx.fillText(`Pontuação Final: ${Math.floor(score)} pts`, LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Distância Total: ${Math.floor(distance)} metros`, LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2 + 35);

        ctx.font = '16px sans-serif';
        ctx.fillText('TOQUE ou ESPAÇO para jogar novamente', LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2 + 85);
        ctx.textAlign = 'left';
      }
    }

    ctx.restore(); // Restaura a escala lógica do canvas

    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
